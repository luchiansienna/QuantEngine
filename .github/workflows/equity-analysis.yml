name: Equity analysis
on: [push, pull_request]
jobs:
  equity-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/EquityAnalysisHarness -c Release
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/quant-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/quant-dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint
